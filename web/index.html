<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Não consigo tirar você da minha cabeça</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

        <div id="coluna">

            <h1>Não consigo tirar você da minha cabeça</h1>

            <p id="registro"></p>

            <article id="texto" class="vazio">aguardando</article>

        </div>

        <aside id="sensores">

            <div class="linha"><span class="rotulo">bateria</span><span class="valor" data-campo="batteryLevel">—</span></div>
            <div class="linha"><span class="rotulo">brilho</span><span class="valor" data-campo="brightness">—</span></div>
            <div class="linha"><span class="rotulo">volume</span><span class="valor" data-campo="volume">—</span></div>
            <div class="linha"><span class="rotulo">microfone</span><span class="valor" data-campo="microphoneLevel">—</span></div>
            <div class="linha"><span class="rotulo">latitude</span><span class="valor" data-campo="latitude">—</span></div>
            <div class="linha"><span class="rotulo">longitude</span><span class="valor" data-campo="longitude">—</span></div>
            <div class="linha"><span class="rotulo">altitude</span><span class="valor" data-campo="altitude">—</span></div>
            <div class="linha"><span class="rotulo">velocidade</span><span class="valor" data-campo="speed">—</span></div>
            <div class="linha"><span class="rotulo">rumo</span><span class="valor" data-campo="heading">—</span></div>
            <div class="linha"><span class="rotulo">aceleração x</span><span class="valor" data-campo="accelerationX">—</span></div>
            <div class="linha"><span class="rotulo">aceleração y</span><span class="valor" data-campo="accelerationY">—</span></div>
            <div class="linha"><span class="rotulo">aceleração z</span><span class="valor" data-campo="accelerationZ">—</span></div>
            <div class="linha"><span class="rotulo">magnético x</span><span class="valor" data-campo="magneticX">—</span></div>
            <div class="linha"><span class="rotulo">magnético y</span><span class="valor" data-campo="magneticY">—</span></div>
            <div class="linha"><span class="rotulo">magnético z</span><span class="valor" data-campo="magneticZ">—</span></div>
            <div class="linha"><span class="rotulo">pressão</span><span class="valor" data-campo="pressure">—</span></div>
            <div class="linha"><span class="rotulo">alt. relativa</span><span class="valor" data-campo="relativeAltitude">—</span></div>
            <div class="linha"><span class="rotulo">orientação</span><span class="valor" data-campo="orientation">—</span></div>
            <div class="linha"><span class="rotulo">proximidade</span><span class="valor" data-campo="proximity">—</span></div>
            <div class="linha"><span class="rotulo">fones</span><span class="valor" data-campo="headphonesConnected">—</span></div>
            <div class="linha"><span class="rotulo">sinal</span><span class="valor" id="conexao">offline</span></div>

        </aside>

    </main>

    <script src="script.js"></script>

</body>
</html>
