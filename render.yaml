services:
  - type: web
    name: nao-consigo-tirar-voce-da-minha-cabeca
    runtime: python
    plan: starter
    region: ohio
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /status
    disk:
      name: registro
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
